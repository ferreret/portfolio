server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative ("Location: /blog/about-me"): behind Traefik and
    # Cloudflare nginx only sees plain http on its own port, and an absolute
    # Location built from that would be wrong.
    absolute_redirect off;

    # Gzip compression (Cloudflare re-encodes to brotli now that no-transform is gone)
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers. NOTE: nginx add_header is NOT inherited into locations
    # that declare their own add_header — repeat these there.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # One URL per page: /blog/, /es/ → /blog, /es.
    rewrite ^/(.+)/$ /$1 permanent;

    # Detail pages were /projects/<id> and /blog/<id> until they got slugs
    # (2026-10). These are the five URLs that existed; nothing newer needs one.
    location = /projects/4 { return 301 /projects/docscan-studio; }
    location = /projects/5 { return 301 /projects/batch-reactor-reprocess-classifier; }
    location = /blog/3 { return 301 /blog/about-me; }
    location = /blog/4 { return 301 /blog/claudio-personal-assistant; }
    location = /blog/5 { return 301 /blog/predicting-batch-reactor-reprocessing; }

    # Every page is a file prerendered at build time (scripts/prerender.mjs):
    # /blog is /blog/index.html, /es is /es/index.html. HTML must revalidate on
    # every load: a cached page after a deploy points at hashed assets that no
    # longer exist. Anything that is not a file is a real 404.
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Unknown URLs get the bare app shell with a 404 status; the app then renders
    # its "not found" view in the language of the URL.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # /cv and /es/cv only exist to print the CV PDFs. They are not prerendered:
    # serve the bare shell and keep them out of search indexes even for crawlers
    # that don't run JS. try_files with a non-final file argument serves it from
    # this location, so these headers apply.
    location ~ ^/(es/)?cv$ {
        try_files /spa.html =404;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # CV PDFs keep a fixed name across updates: always revalidate (ETag /
    # Last-Modified make that a cheap 304) so neither browsers nor Cloudflare
    # keep serving an outdated CV for hours after a deploy.
    location ~* \.pdf$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Long cache for static assets (hashed filenames make them immutable)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
