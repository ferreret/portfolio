  <script>
    // Spanish lives under /es. A Spanish-speaking visitor who lands on an English
    // URL is taken to its Spanish counterpart before anything is painted, unless
    // they picked English on the language switch (which stores 'lang').
    try {
      var path = location.pathname, lang = localStorage.getItem('lang');
      if (!/^\/es(\/|$)/.test(path) && lang !== 'en' && (lang === 'es' || /^es\b/i.test(navigator.language || ''))) {
        location.replace('/es' + (path === '/' ? '' : path) + location.search + location.hash);
      }
    } catch (e) { }
  </script>
